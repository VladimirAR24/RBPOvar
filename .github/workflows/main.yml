name: SAST Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SAST Docker image
        run: |
          docker build -t int-public-sast .

      - name: Run SAST tools and save reports
        run: |
          docker run --rm int-public-sast sh -c "\
            bandit --ini /app/.bandit -r /app/scr > /app/bandit-report.txt 2>&1 || true; \
            semgrep scan --config /app/semgrep.yml /app/scr --text-output=/app/semgrep-report.txt --json-output=/app/semgrep-report.json || true; \
            echo '===== BANDIT REPORT ====='; cat /app/bandit-report.txt; \
            echo; \
            echo '===== SEMGREP REPORT ====='; cat /app/semgrep-report.txt; \
          " > sast-report.txt 2>&1 || true

          echo "===== COMBINED SAST REPORT ====="
          cat sast-report.txt

      - name: Copy reports from container workspace
        run: |
          CID=$(docker create int-public-sast)
          docker cp "$CID":/app/bandit-report.txt ./bandit-report.txt || true
          docker cp "$CID":/app/semgrep-report.txt ./semgrep-report.txt || true
          docker cp "$CID":/app/semgrep-report.json ./semgrep-report.json || true
          docker rm "$CID"

      - name: Show Semgrep findings summary
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          path = Path("semgrep-report.json")
          if not path.exists():
              print("semgrep-report.json not found")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8", errors="ignore"))
          results = data.get("results", [])

          print("===== SEMGREP FINDINGS SUMMARY =====")
          if not results:
              print("No Semgrep findings detected")
              raise SystemExit(0)

          for i, result in enumerate(results, 1):
              rule_id = result.get("check_id", "unknown-rule")
              path_ = result.get("path", "unknown-file")
              start = result.get("start", {})
              line = start.get("line", "?")
              extra = result.get("extra", {})
              severity = extra.get("severity", result.get("severity", "UNKNOWN"))
              message = extra.get("message", "").strip()

              print(f"{i}. [{severity}] {rule_id}")
              print(f"   File: {path_}:{line}")
              print(f"   Message: {message}")
              print()
          EOF

      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: |
            sast-report.txt
            bandit-report.txt
            semgrep-report.txt
            semgrep-report.json
          retention-days: 7

  download_artifacts:
    name: Download Artifacts
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Download SAST artifacts
        uses: actions/download-artifact@v4
        with:
          name: sast-report

      - name: Show downloaded files
        run: |
          echo "===== DOWNLOADED ARTIFACTS ====="
          ls -la
          echo
          echo "===== semgrep-report.txt ====="
          cat semgrep-report.txt || true
          echo
          echo "===== bandit-report.txt ====="
          cat bandit-report.txt || true

  security_gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Download SAST artifacts
        uses: actions/download-artifact@v4
        with:
          name: sast-report

      - name: Check Semgrep JSON report
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path("semgrep-report.json")

          if not report_path.exists():
              print("SECURITY GATE FAILED: semgrep-report.json not found")
              sys.exit(1)

          data = json.loads(report_path.read_text(encoding="utf-8", errors="ignore"))
          results = data.get("results", [])

          blocking = []

          for result in results:
              extra = result.get("extra", {})
              severity = str(extra.get("severity", result.get("severity", "UNKNOWN"))).upper()

              if severity in {"HIGH", "CRITICAL", "ERROR"}:
                  blocking.append({
                      "rule_id": result.get("check_id", "unknown-rule"),
                      "file": result.get("path", "unknown-file"),
                      "line": result.get("start", {}).get("line", "?"),
                      "severity": severity,
                      "message": extra.get("message", "").strip()
                  })

          print("Security Gate policy:")
          print("- block pipeline if HIGH or CRITICAL findings are present")
          print()

          if blocking:
              print("Detected blocking findings:")
              for item in blocking:
                  print(f"- [{item['severity']}] {item['rule_id']} at {item['file']}:{item['line']}")
                  print(f"  {item['message']}")
              print()
              print("SECURITY GATE FAILED")
              sys.exit(1)

          print("No blocking HIGH/CRITICAL findings detected")
          print("SECURITY GATE PASSED")
          EOF