name: SAST Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SAST Docker image
        run: |
          docker build -t int-public-sast .

      - name: Run SAST tools and save report
        run: |
          docker run --rm int-public-sast > sast-report.txt 2>&1 || true
          cat sast-report.txt

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.txt
          retention-days: 7

  security_gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Download SAST report
        uses: actions/download-artifact@v4
        with:
          name: sast-report

      - name: Check SAST report
        run: |
          python3 << 'EOF'
          import re
          import sys
          from pathlib import Path

          report_path = Path("sast-report.txt")

          if not report_path.exists():
              print("SECURITY GATE FAILED: sast-report.txt not found")
              sys.exit(1)

          content = report_path.read_text(encoding="utf-8", errors="ignore")

          critical_patterns = [
              r"Severity:\s*HIGH",
              r"severity:\s*HIGH",
              r"\bHIGH\b",
              r"CWE-400",
              r"CWE-835"
          ]

          found = []

          for pattern in critical_patterns:
              if re.search(pattern, content, re.IGNORECASE):
                  found.append(pattern)

          print("Security Gate policy:")
          print("- block pipeline if HIGH findings or critical CWE patterns are found")
          print()
          print("Detected blocking patterns:", found)

          if found:
              print("SECURITY GATE FAILED")
              sys.exit(1)

          print("SECURITY GATE PASSED")
          EOF