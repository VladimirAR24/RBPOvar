name: Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # =========================================================
  # 1. SAST
  # =========================================================
  sast:
    name: SAST Analyz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SAST reports directory
        run: mkdir -p reports/sast

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config p/security-audit --json -o reports/sast/semgrep-report.json main.cpp || true

          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config p/security-audit -o reports/sast/semgrep-report.txt main.cpp || true

      - name: Generate SAST summary
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          path = Path("reports/sast/semgrep-report.json")
          data = json.loads(path.read_text(encoding="utf-8", errors="ignore") or "{}") if path.exists() else {}
          results = data.get("results", [])

          with open("reports/sast/sast-summary.txt", "w", encoding="utf-8") as f:
              f.write("SAST tool: Semgrep\n")
              f.write("Target: main.cpp\n")
              f.write(f"Findings total: {len(results)}\n")
              if not results:
                  f.write("Result: no Semgrep findings detected\n")
              else:
                  for i, result in enumerate(results, 1):
                      extra = result.get("extra", {})
                      severity = str(extra.get("severity", result.get("severity", "UNKNOWN"))).upper()
                      f.write(f"{i}. [{severity}] {result.get('check_id', 'unknown-rule')} ")
                      f.write(f"at {result.get('path', 'unknown-file')}:{result.get('start', {}).get('line', '?')}\n")
                      f.write(f"   {extra.get('message', '').strip()}\n")
          EOF

      - name: Show SAST reports
        run: |
          echo "===== SAST REPORTS ====="
          ls -la reports/sast
          echo
          cat reports/sast/sast-summary.txt
          echo
          echo "===== SEMGREP TXT REPORT ====="
          cat reports/sast/semgrep-report.txt || true

      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: |
            reports/sast/semgrep-report.json
            reports/sast/semgrep-report.txt
            reports/sast/sast-summary.txt
          if-no-files-found: error
          retention-days: 7

  # =========================================================
  # 2. SCA: CycloneDX SBOM + Trivy vulnerability analysis
  # =========================================================
  sca:
    name: SCA Analyz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SCA reports directory
        run: mkdir -p reports/sca

      - name: Build Docker image for SCA
        run: |
          docker build -t telemetry-dast:ci .

      - name: Generate CycloneDX SBOM from Docker image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/reports/sca:/reports" \
            ghcr.io/aquasecurity/trivy:latest image \
            --format cyclonedx \
            --output /reports/sbom.json \
            telemetry-dast:ci

      - name: Run Trivy image vulnerability scan TXT
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/reports/sca:/reports" \
            ghcr.io/aquasecurity/trivy:latest image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table \
            --output /reports/trivy-report.txt \
            telemetry-dast:ci || true

      - name: Run Trivy image vulnerability scan JSON
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/reports/sca:/reports" \
            ghcr.io/aquasecurity/trivy:latest image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json \
            --output /reports/trivy-report.json \
            telemetry-dast:ci || true

      - name: Generate SCA summary
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          report_path = Path("reports/sca/trivy-report.json")
          sbom_path = Path("reports/sca/sbom.json")

          data = json.loads(report_path.read_text(encoding="utf-8", errors="ignore") or "{}") if report_path.exists() else {}
          sbom = json.loads(sbom_path.read_text(encoding="utf-8", errors="ignore") or "{}") if sbom_path.exists() else {}

          vulns = []
          for result in data.get("Results", []) or []:
              target = result.get("Target", "unknown-target")
              for vuln in result.get("Vulnerabilities", []) or []:
                  vulns.append((target, vuln))

          severities = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0, "UNKNOWN": 0}
          for _, vuln in vulns:
              severity = str(vuln.get("Severity", "UNKNOWN")).upper()
              severities[severity] = severities.get(severity, 0) + 1

          components = sbom.get("components", []) or []

          with open("reports/sca/sca-summary.txt", "w", encoding="utf-8") as f:
              f.write("SCA tool: Trivy\n")
              f.write("Target: Docker image telemetry-dast:ci\n")
              f.write("SBOM format: CycloneDX\n")
              f.write(f"SBOM components: {len(components)}\n")
              f.write(f"Vulnerabilities total: {len(vulns)}\n")
              for key in ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]:
                  f.write(f"{key}: {severities.get(key, 0)}\n")
          EOF

      - name: Show SCA reports
        run: |
          echo "===== SCA REPORTS ====="
          ls -la reports/sca
          echo
          cat reports/sca/sca-summary.txt
          echo
          echo "===== TRIVY TXT REPORT ====="
          cat reports/sca/trivy-report.txt || true
          echo
          echo "===== SBOM HEAD ====="
          head -40 reports/sca/sbom.json || true

      - name: Upload SCA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            reports/sca/sbom.json
            reports/sca/trivy-report.txt
            reports/sca/trivy-report.json
            reports/sca/sca-summary.txt
          if-no-files-found: error
          retention-days: 7

  # =========================================================
  # 3. Valgrind dynamic analysis
  # =========================================================
  valgrind:
    name: Valgrind Analyz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ valgrind python3

      - name: Prepare input files
        run: |
          python3 generate_samples.py
          ls -la input

      - name: Build application for Valgrind
        run: |
          g++ -std=c++17 -g -O0 -Wall -Wextra main.cpp -o telemetry_parser

      - name: Run Valgrind analysis
        run: |
          mkdir -p reports/valgrind
          set +e
          valgrind \
            --leak-check=full \
            --track-origins=yes \
            --error-exitcode=1 \
            ./telemetry_parser input/valid.evt \
            > reports/valgrind/valgrind-report.txt 2>&1
          VALGRIND_EXIT_CODE=$?
          echo "$VALGRIND_EXIT_CODE" > reports/valgrind/valgrind-exit-code.txt
          cat reports/valgrind/valgrind-report.txt
          echo "Valgrind exit code: $VALGRIND_EXIT_CODE"
          exit 0

      - name: Upload Valgrind artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-report
          path: |
            reports/valgrind/valgrind-report.txt
            reports/valgrind/valgrind-exit-code.txt
          if-no-files-found: error
          retention-days: 7

  # =========================================================
  # 4. AFL++ fuzzing
  # =========================================================
  fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AFL++ and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang afl++ python3

      - name: Prepare input corpus
        run: |
          python3 generate_samples.py
          ls -la input

      - name: Build AFL++ instrumented binary
        run: |
          afl-clang++ -std=c++17 -g -O0 -fsanitize=address main.cpp -o telemetry_parser_afl

      - name: Run AFL++ fuzzing
        env:
          AFL_SKIP_CPUFREQ: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_NO_UI: "1"
          ASAN_OPTIONS: "abort_on_error=1:symbolize=0:detect_leaks=0"
        run: |
          mkdir -p reports/fuzzing
          rm -rf fuzzing-output
          set +e
          timeout 2m afl-fuzz -i input -o fuzzing-output -- ./telemetry_parser_afl @@ \
            > reports/fuzzing/fuzzing-log.txt 2>&1
          FUZZING_EXIT_CODE=$?
          echo "$FUZZING_EXIT_CODE" > reports/fuzzing/fuzzing-exit-code.txt

          CRASH_COUNT=$(find fuzzing-output/default/crashes -type f -name 'id:*' 2>/dev/null | wc -l | tr -d ' ')
          HANG_COUNT=$(find fuzzing-output/default/hangs -type f -name 'id:*' 2>/dev/null | wc -l | tr -d ' ')

          echo "$CRASH_COUNT" > reports/fuzzing/fuzzing-crash-count.txt
          echo "$HANG_COUNT" > reports/fuzzing/fuzzing-hang-count.txt

          {
            echo "Fuzzing tool: AFL++"
            echo "Target: telemetry_parser_afl"
            echo "Fuzzing exit code: $FUZZING_EXIT_CODE"
            echo "Saved crashes: $CRASH_COUNT"
            echo "Saved hangs: $HANG_COUNT"
          } > reports/fuzzing/fuzzing-summary.txt

          if [ -d fuzzing-output/default/crashes ]; then
            find fuzzing-output/default/crashes -type f -name 'id:*' > reports/fuzzing/fuzzing-crashes-list.txt || true
          else
            : > reports/fuzzing/fuzzing-crashes-list.txt
          fi

          echo "===== FUZZING SUMMARY ====="
          cat reports/fuzzing/fuzzing-summary.txt
          echo
          echo "===== AFL++ LOG TAIL ====="
          tail -80 reports/fuzzing/fuzzing-log.txt || true
          exit 0

      - name: Upload Fuzzing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-report
          path: reports/fuzzing/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload AFL++ raw output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzzing-raw-output
          path: fuzzing-output
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================
  # 5. Security Gate: SAST + SCA + Valgrind + Fuzzing
  # =========================================================
  security_gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca
      - valgrind
      - fuzzing
    if: always()

    steps:
      - name: Download SAST artifacts
        uses: actions/download-artifact@v4
        with:
          name: sast-report
          path: downloaded-reports/sast

      - name: Download SCA artifacts
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: downloaded-reports/sca

      - name: Download Valgrind artifacts
        uses: actions/download-artifact@v4
        with:
          name: valgrind-report
          path: downloaded-reports/valgrind

      - name: Download Fuzzing artifacts
        uses: actions/download-artifact@v4
        with:
          name: fuzzing-report
          path: downloaded-reports/fuzzing

      - name: Show downloaded reports
        run: |
          echo "===== DOWNLOADED REPORTS ====="
          find downloaded-reports -maxdepth 3 -type f -print | sort

      - name: Run Security Gate checks
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          failed = False

          print("===== SECURITY GATE POLICY =====")
          print("1. SAST: block if HIGH, CRITICAL or ERROR Semgrep findings are present")
          print("2. SCA: block if CRITICAL Trivy vulnerabilities are present")
          print("3. Valgrind: block if Valgrind exit code is not 0 or memory errors are detected")
          print("4. Fuzzing: block if AFL++ saved crashes are present")
          print()

          # ---------- SAST ----------
          sast_path = Path("downloaded-reports/sast/semgrep-report.json")
          if not sast_path.exists():
              print("SAST SECURITY GATE FAILED: semgrep-report.json not found")
              failed = True
          else:
              data = json.loads(sast_path.read_text(encoding="utf-8", errors="ignore") or "{}")
              results = data.get("results", [])
              blocking = []
              for result in results:
                  extra = result.get("extra", {})
                  severity = str(extra.get("severity", result.get("severity", "UNKNOWN"))).upper()
                  if severity in {"HIGH", "CRITICAL", "ERROR"}:
                      blocking.append(result)

              print(f"SAST blocking findings: {len(blocking)}")
              if blocking:
                  for item in blocking:
                      extra = item.get("extra", {})
                      print(f"- {item.get('check_id', 'unknown-rule')} at {item.get('path', 'unknown-file')}:{item.get('start', {}).get('line', '?')}")
                      print(f"  {extra.get('message', '').strip()}")
                  failed = True
              else:
                  print("SAST SECURITY GATE PASSED")
              print()

          # ---------- SCA ----------
          sca_path = Path("downloaded-reports/sca/trivy-report.json")
          if not sca_path.exists():
              print("SCA SECURITY GATE FAILED: trivy-report.json not found")
              failed = True
          else:
              data = json.loads(sca_path.read_text(encoding="utf-8", errors="ignore") or "{}")
              critical = []
              high = []
              for result in data.get("Results", []) or []:
                  target = result.get("Target", "unknown-target")
                  for vuln in result.get("Vulnerabilities", []) or []:
                      severity = str(vuln.get("Severity", "UNKNOWN")).upper()
                      item = (target, vuln)
                      if severity == "CRITICAL":
                          critical.append(item)
                      elif severity == "HIGH":
                          high.append(item)

              print(f"SCA CRITICAL vulnerabilities: {len(critical)}")
              print(f"SCA HIGH vulnerabilities: {len(high)}")
              if critical:
                  for target, vuln in critical:
                      print(f"- {vuln.get('VulnerabilityID', 'unknown-cve')} in {target}: {vuln.get('PkgName', 'unknown-package')} {vuln.get('InstalledVersion', '')}")
                      fixed = vuln.get("FixedVersion", "")
                      if fixed:
                          print(f"  Fixed version: {fixed}")
                  failed = True
              else:
                  print("SCA SECURITY GATE PASSED")
              print()

          # ---------- Valgrind ----------
          valgrind_code_path = Path("downloaded-reports/valgrind/valgrind-exit-code.txt")
          valgrind_report_path = Path("downloaded-reports/valgrind/valgrind-report.txt")
          if not valgrind_code_path.exists() or not valgrind_report_path.exists():
              print("VALGRIND SECURITY GATE FAILED: Valgrind report files not found")
              failed = True
          else:
              exit_code = valgrind_code_path.read_text(encoding="utf-8", errors="ignore").strip()
              report = valgrind_report_path.read_text(encoding="utf-8", errors="ignore")
              no_memory_errors = "ERROR SUMMARY: 0 errors" in report
              no_leaks = (
                  "All heap blocks were freed -- no leaks are possible" in report
                  or "definitely lost: 0 bytes" in report
              )

              print(f"Valgrind exit code: {exit_code}")
              print(f"Valgrind memory errors absent: {no_memory_errors}")
              print(f"Valgrind leaks absent: {no_leaks}")

              if exit_code != "0" or not no_memory_errors or not no_leaks:
                  print("VALGRIND SECURITY GATE FAILED")
                  failed = True
              else:
                  print("VALGRIND SECURITY GATE PASSED")
              print()

          # ---------- Fuzzing ----------
          fuzzing_dir = Path("downloaded-reports/fuzzing")

          crash_count_matches = list(fuzzing_dir.rglob("fuzzing-crash-count.txt"))
          exit_code_matches = list(fuzzing_dir.rglob("fuzzing-exit-code.txt"))
          log_matches = list(fuzzing_dir.rglob("fuzzing-log.txt"))

          if not crash_count_matches:
              print("FUZZING SECURITY GATE FAILED: fuzzing-crash-count.txt not found")
              print("Downloaded fuzzing files:")
              for file in sorted(fuzzing_dir.rglob("*")):
                  if file.is_file():
                      print(f"- {file}")
              failed = True
          else:
              crash_count_path = crash_count_matches[0]
              try:
                  crash_count = int(crash_count_path.read_text(encoding="utf-8", errors="ignore").strip() or "0")
              except ValueError:
                  crash_count = -1

              fuzzing_exit_code = "unknown"
              if exit_code_matches:
                  fuzzing_exit_code = exit_code_matches[0].read_text(encoding="utf-8", errors="ignore").strip()

              fuzzing_log = ""
              if log_matches:
                  fuzzing_log = log_matches[0].read_text(encoding="utf-8", errors="ignore")

              fuzzing_aborted = "PROGRAM ABORT" in fuzzing_log

              print(f"AFL++ report path: {crash_count_path}")
              print(f"AFL++ exit code: {fuzzing_exit_code}")
              print(f"AFL++ saved crashes: {crash_count}")
              print(f"AFL++ internal abort detected: {fuzzing_aborted}")

              # timeout returns 124 when the fixed fuzzing time expires.
              acceptable_exit_codes = {"0", "124"}

              if fuzzing_aborted:
                  print("FUZZING SECURITY GATE FAILED: AFL++ aborted before fuzzing started")
                  failed = True
              elif fuzzing_exit_code not in acceptable_exit_codes:
                  print("FUZZING SECURITY GATE FAILED: unexpected AFL++ exit code")
                  failed = True
              elif crash_count != 0:
                  print("FUZZING SECURITY GATE FAILED")
                  failed = True
              else:
                  print("FUZZING SECURITY GATE PASSED")
              print()

          if failed:
              print("SECURITY GATE FAILED: pipeline is blocked")
              sys.exit(1)

          print("SECURITY GATE PASSED: no blocking security issues detected")
          EOF
