name: Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # =========================================================
  # 1. SAST
  # =========================================================
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SAST Docker image
        run: |
          docker build -t int-public-sast .

      - name: Prepare reports directory
        run: |
          mkdir -p reports

      - name: Run SAST tools and save reports
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/reports:/out" \
            int-public-sast sh -c "
              bandit --ini /app/.bandit -r /app/scr > /out/bandit-report.txt 2>&1 || true
              semgrep scan --config /app/semgrep.yml /app/scr > /out/semgrep-report.txt 2>/out/semgrep.log || true
              semgrep scan --config /app/semgrep.yml --json -o /out/semgrep-report.json /app/scr || true
            "

      - name: Show generated files
        run: |
          echo "===== REPORTS DIRECTORY ====="
          ls -la reports
          echo
          echo "===== BANDIT REPORT ====="
          cat reports/bandit-report.txt || true
          echo
          echo "===== SEMGREP REPORT ====="
          cat reports/semgrep-report.txt || true
          echo
          echo "===== SEMGREP LOG ====="
          cat reports/semgrep.log || true

      - name: Show Semgrep findings summary
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          path = Path("reports/semgrep-report.json")
          if not path.exists():
              print("semgrep-report.json not found")
              raise SystemExit(1)

          data = json.loads(path.read_text(encoding="utf-8", errors="ignore"))
          results = data.get("results", [])

          print("===== SEMGREP FINDINGS SUMMARY =====")
          if not results:
              print("No Semgrep findings detected")
              raise SystemExit(0)

          for i, result in enumerate(results, 1):
              rule_id = result.get("check_id", "unknown-rule")
              path_ = result.get("path", "unknown-file")
              line = result.get("start", {}).get("line", "?")
              extra = result.get("extra", {})
              severity = str(extra.get("severity", result.get("severity", "UNKNOWN"))).upper()
              message = extra.get("message", "").strip()

              print(f"{i}. [{severity}] {rule_id}")
              print(f"   File: {path_}:{line}")
              print(f"   Message: {message}")
              print()
          EOF

      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: |
            reports/bandit-report.txt
            reports/semgrep-report.txt
            reports/semgrep-report.json
            reports/semgrep.log
          retention-days: 7

  # =========================================================
  # 2. SCA: CycloneDX SBOM + Trivy vulnerability analysis
  # =========================================================
  sca:
    name: SCA Analysis
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SCA reports directory
        run: |
          mkdir -p sca-reports

      - name: Generate SBOM in CycloneDX format
        run: |
          echo "===== GENERATE SBOM: CycloneDX ====="
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            ghcr.io/aquasecurity/trivy:latest fs \
            --format cyclonedx \
            --output /src/sca-reports/sbom.json \
            /src

      - name: Run Trivy vulnerability scan TXT
        run: |
          echo "===== TRIVY VULNERABILITY SCAN: TXT ====="
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            ghcr.io/aquasecurity/trivy:latest fs \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table \
            --output /src/sca-reports/trivy_report.txt \
            /src

      - name: Run Trivy vulnerability scan JSON
        run: |
          echo "===== TRIVY VULNERABILITY SCAN: JSON ====="
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            ghcr.io/aquasecurity/trivy:latest fs \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json \
            --output /src/sca-reports/trivy_report.json \
            /src

      - name: Show SCA reports
        run: |
          echo "===== SCA REPORTS DIRECTORY ====="
          ls -la sca-reports
          echo
          echo "===== TRIVY REPORT TXT ====="
          cat sca-reports/trivy_report.txt || true
          echo
          echo "===== SBOM HEAD ====="
          head -40 sca-reports/sbom.json || true

      - name: Upload SCA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            sca-reports/sbom.json
            sca-reports/trivy_report.txt
            sca-reports/trivy_report.json
          retention-days: 7

  # =========================================================
  # Optional: artifact check
  # =========================================================
  download_artifacts:
    name: Download Artifacts
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca

    steps:
      - name: Download SAST artifacts
        uses: actions/download-artifact@v4
        with:
          name: sast-report
          path: downloaded-reports/sast

      - name: Download SCA artifacts
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: downloaded-reports/sca

      - name: Show downloaded files
        run: |
          echo "===== DOWNLOADED SAST ARTIFACTS ====="
          ls -la downloaded-reports/sast
          echo
          echo "===== DOWNLOADED SCA ARTIFACTS ====="
          ls -la downloaded-reports/sca
          echo
          echo "===== semgrep-report.txt ====="
          cat downloaded-reports/sast/semgrep-report.txt || true
          echo
          echo "===== bandit-report.txt ====="
          cat downloaded-reports/sast/bandit-report.txt || true
          echo
          echo "===== trivy_report.txt ====="
          cat downloaded-reports/sca/trivy_report.txt || true

  # =========================================================
  # 3. Security Gate: SAST + SCA checks
  # =========================================================
  security_gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca

    steps:
      - name: Download SAST artifacts
        uses: actions/download-artifact@v4
        with:
          name: sast-report
          path: downloaded-reports/sast

      - name: Download SCA artifacts
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: downloaded-reports/sca

      - name: Check Semgrep JSON report
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path("downloaded-reports/sast/semgrep-report.json")

          if not report_path.exists():
              print("SECURITY GATE FAILED: semgrep-report.json not found")
              sys.exit(1)

          data = json.loads(report_path.read_text(encoding="utf-8", errors="ignore"))
          results = data.get("results", [])

          blocking = []

          for result in results:
              extra = result.get("extra", {})
              severity = str(extra.get("severity", result.get("severity", "UNKNOWN"))).upper()

              if severity in {"HIGH", "CRITICAL", "ERROR"}:
                  blocking.append({
                      "rule_id": result.get("check_id", "unknown-rule"),
                      "file": result.get("path", "unknown-file"),
                      "line": result.get("start", {}).get("line", "?"),
                      "severity": severity,
                      "message": extra.get("message", "").strip()
                  })

          print("SAST Security Gate policy:")
          print("- block pipeline if HIGH, CRITICAL or ERROR Semgrep findings are present")
          print()

          if blocking:
              print("Detected blocking SAST findings:")
              for item in blocking:
                  print(f"- [{item['severity']}] {item['rule_id']} at {item['file']}:{item['line']}")
                  print(f"  {item['message']}")
              print()
              print("SAST SECURITY GATE FAILED")
              sys.exit(1)

          print("No blocking HIGH/CRITICAL/ERROR Semgrep findings detected")
          print("SAST SECURITY GATE PASSED")
          EOF

      - name: Check Trivy JSON report
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path("downloaded-reports/sca/trivy_report.json")

          if not report_path.exists():
              print("SECURITY GATE FAILED: trivy_report.json not found")
              sys.exit(1)

          data = json.loads(report_path.read_text(encoding="utf-8", errors="ignore"))

          vulnerabilities = []
          for result in data.get("Results", []):
              target = result.get("Target", "unknown-target")
              for vuln in result.get("Vulnerabilities", []) or []:
                  vulnerabilities.append({
                      "target": target,
                      "id": vuln.get("VulnerabilityID", "unknown-cve"),
                      "pkg": vuln.get("PkgName", "unknown-package"),
                      "installed": vuln.get("InstalledVersion", "unknown-version"),
                      "fixed": vuln.get("FixedVersion", ""),
                      "severity": str(vuln.get("Severity", "UNKNOWN")).upper(),
                      "title": vuln.get("Title", "").strip()
                  })

          critical = [v for v in vulnerabilities if v["severity"] == "CRITICAL"]
          high = [v for v in vulnerabilities if v["severity"] == "HIGH"]
          medium = [v for v in vulnerabilities if v["severity"] == "MEDIUM"]
          low = [v for v in vulnerabilities if v["severity"] == "LOW"]

          print("SCA Security Gate policy:")
          print("- block pipeline if CRITICAL vulnerabilities are present")
          print("- warn on HIGH and MEDIUM vulnerabilities")
          print()
          print(f"CRITICAL: {len(critical)}")
          print(f"HIGH: {len(high)}")
          print(f"MEDIUM: {len(medium)}")
          print(f"LOW: {len(low)}")
          print()

          if high:
              print("HIGH vulnerabilities:")
              for item in high:
                  print(f"- {item['id']} ({item['pkg']} {item['installed']}) [{item['severity']}]")
                  if item["fixed"]:
                      print(f"  Fixed version: {item['fixed']}")
                  print(f"  {item['title']}")
              print()

          if critical:
              print("Detected blocking CRITICAL vulnerabilities:")
              for item in critical:
                  print(f"- {item['id']} ({item['pkg']} {item['installed']}) [{item['severity']}]")
                  if item["fixed"]:
                      print(f"  Fixed version: {item['fixed']}")
                  print(f"  {item['title']}")
              print()
              print("SCA SECURITY GATE FAILED")
              sys.exit(1)

          print("No blocking CRITICAL vulnerabilities detected")
          print("SCA SECURITY GATE PASSED")
          EOF