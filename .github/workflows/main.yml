name: SAST Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SAST Docker image
        run: |
          docker build -t int-public-sast .

      - name: Run SAST tools and save report
        run: |
          docker run --rm int-public-sast > sast-report.txt 2>&1 || true
          echo "===== SAST REPORT ====="
          cat sast-report.txt

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.txt
          retention-days: 7

  download_artifacts:
    name: Download Artifacts
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Download SAST report artifact
        uses: actions/download-artifact@v4
        with:
          name: sast-report

      - name: Show downloaded files
        run: |
          echo "===== DOWNLOADED ARTIFACTS ====="
          ls -la
          echo
          echo "===== CONTENT OF sast-report.txt ====="
          cat sast-report.txt

  security_gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Download SAST report
        uses: actions/download-artifact@v4
        with:
          name: sast-report

      - name: Check SAST report
        run: |
          python3 << 'EOF'
          import re
          import sys
          from pathlib import Path

          report_path = Path("sast-report.txt")

          if not report_path.exists():
              print("SECURITY GATE FAILED: sast-report.txt not found")
              sys.exit(1)

          content = report_path.read_text(encoding="utf-8", errors="ignore")

          blocking_matches = []

          # Ищем только достаточно конкретные индикаторы HIGH severity
          specific_patterns = [
              r"Severity:\s*HIGH",
              r"severity:\s*HIGH",
              r"Issue severity:\s*HIGH",
              r"High severity findings:\s*[1-9]\d*",
          ]

          for pattern in specific_patterns:
              matches = re.findall(pattern, content, flags=re.IGNORECASE)
              if matches:
                  blocking_matches.extend(matches)

          print("Security Gate policy:")
          print("- block pipeline only if report contains real HIGH severity findings")
          print()

          if blocking_matches:
              print("Detected blocking findings:")
              for m in blocking_matches:
                  print("-", m)
              print()
              print("SECURITY GATE FAILED")
              sys.exit(1)

          print("No blocking HIGH severity findings detected")
          print("SECURITY GATE PASSED")
          EOF